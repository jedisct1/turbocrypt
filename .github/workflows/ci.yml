name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build
        run: zig build

      - name: Run tests
        run: zig build test

      - name: Git integration scenario
        # The scenario is a POSIX shell script. The Zig tests cover the git flow on Windows.
        if: runner.os != 'Windows'
        run: zig build test-git

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
